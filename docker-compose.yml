# Запуск: docker compose up --build   → http://localhost:8000 (порт можно сменить: TRAM_PORT=8010 docker compose up)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run backend/setup_env.py to create .env}
      POSTGRES_USER: ${POSTGRES_USER:?Run backend/setup_env.py to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run backend/setup_env.py to create .env}
    volumes:
      - tram-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tram:
    build: .
    image: moskvy-tram-forecast
    ports:
      - "${TRAM_BIND:-127.0.0.1}:${TRAM_PORT:-8000}:8000"
    environment:
      # Принятые через API валидации хранятся на томе и переживают пересоздание контейнера
      INGEST_FILE: /data/ingested.csv
      # Для публичного сервера задайте INGEST_API_KEY и TRAM_BIND=0.0.0.0.
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_USERNAME: ${AUTH_USERNAME:?Run backend/setup_env.py to create .env}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Run backend/setup_env.py to create .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tram-data:/data
    # Профиль из требований: один контейнер 2 vCPU / 2 ГБ RAM
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tram-data:
  tram-postgres:
