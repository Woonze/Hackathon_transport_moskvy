# Add inside the existing Caddy named route, before its catch-all `handle`.
# All HTTP requests for this path redirect to the existing HTTPS domain.
@tram_http {
	path /tram /tram/*
	protocol http
}
redir @tram_http https://pigmentmusic.world{uri} 308

handle /tram {
	redir /tram/ 308
}

handle_path /tram/* {
	reverse_proxy tram-app:8000
}
